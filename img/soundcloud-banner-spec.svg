<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2680 780" width="2680" height="780" role="img" aria-labelledby="t d">
  <title id="t">Banner canvas specification: 2480 by 520 pixels</title>
  <desc id="d">A 2480 by 520 pixel banner canvas with a 2240 by 380 pixel safe area, showing 120 pixel side crops and 70 pixel top and bottom crops.</desc>

  <defs>
    <pattern id="crop" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="22" fill="#FFF3EA"/>
      <line x1="0" y1="0" x2="0" y2="22" stroke="#F0A878" stroke-width="9"/>
    </pattern>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0 1 L11 6 L0 11 z" fill="#22304A"/>
    </marker>
    <marker id="arT" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0 1 L11 6 L0 11 z" fill="#1E8FA0"/>
    </marker>
  </defs>

  <rect width="2680" height="780" fill="#F5F7FA"/>

  <!-- canvas -->
  <rect x="100" y="160" width="2480" height="520" fill="#FFFFFF"/>

  <!-- crop strips -->
  <rect x="100" y="160" width="120" height="520" fill="url(#crop)"/>
  <rect x="2460" y="160" width="120" height="520" fill="url(#crop)"/>
  <rect x="220" y="160" width="2240" height="70" fill="url(#crop)"/>
  <rect x="220" y="610" width="2240" height="70" fill="url(#crop)"/>

  <!-- canvas border -->
  <rect x="100" y="160" width="2480" height="520" fill="none" stroke="#22304A" stroke-width="6"/>

  <!-- safe area -->
  <rect x="220" y="230" width="2240" height="380" fill="none" stroke="#1E8FA0" stroke-width="6" stroke-dasharray="26 16"/>

  <!-- centre guides -->
  <line x1="1340" y1="160" x2="1340" y2="680" stroke="#C8D3E2" stroke-width="4" stroke-dasharray="10 14"/>
  <line x1="100" y1="420" x2="2580" y2="420" stroke="#C8D3E2" stroke-width="4" stroke-dasharray="10 14"/>
  <circle cx="1340" cy="420" r="9" fill="#22304A"/>
  <text stroke="none" x="1362" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#6B7A90">Centre</text>

  <!-- width dimension 2480 -->
  <line x1="100" y1="108" x2="2580" y2="108" stroke="#22304A" stroke-width="4" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <line x1="100" y1="108" x2="100" y2="148" stroke="#22304A" stroke-width="4"/>
  <line x1="2580" y1="108" x2="2580" y2="148" stroke="#22304A" stroke-width="4"/>
  <rect x="1226" y="78" width="228" height="52" fill="#F5F7FA"/>
  <text stroke="none" x="1340" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="800" fill="#22304A" text-anchor="middle">2480 px</text>

  <!-- height dimension 520 -->
  <line x1="52" y1="160" x2="52" y2="680" stroke="#22304A" stroke-width="4" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <line x1="52" y1="160" x2="92" y2="160" stroke="#22304A" stroke-width="4"/>
  <line x1="52" y1="680" x2="92" y2="680" stroke="#22304A" stroke-width="4"/>
  <g transform="translate(52,420) rotate(-90)">
    <rect x="-108" y="-64" width="216" height="52" fill="#F5F7FA"/>
    <text stroke="none" x="0" y="-26" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="800" fill="#22304A" text-anchor="middle">520 px</text>
  </g>

  <!-- safe area width dimension -->
  <line x1="220" y1="722" x2="2460" y2="722" stroke="#1E8FA0" stroke-width="4" marker-start="url(#arT)" marker-end="url(#arT)"/>
  <line x1="220" y1="700" x2="220" y2="740" stroke="#1E8FA0" stroke-width="4"/>
  <line x1="2460" y1="700" x2="2460" y2="740" stroke="#1E8FA0" stroke-width="4"/>
  <rect x="1214" y="696" width="252" height="48" fill="#F5F7FA"/>
  <text stroke="none" x="1340" y="731" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="800" fill="#1E8FA0" text-anchor="middle">2240 px</text>

  <!-- crop size chips -->
  <g>
    <rect x="112" y="386" width="96" height="68" rx="10" fill="#FFFFFF" stroke="#D9822B" stroke-width="3"/>
    <text stroke="none" x="160" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#B4651A" text-anchor="middle">120</text>
    <text stroke="none" x="160" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#B4651A" text-anchor="middle">px</text>

    <rect x="2472" y="386" width="96" height="68" rx="10" fill="#FFFFFF" stroke="#D9822B" stroke-width="3"/>
    <text stroke="none" x="2520" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#B4651A" text-anchor="middle">120</text>
    <text stroke="none" x="2520" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#B4651A" text-anchor="middle">px</text>

    <rect x="1740" y="176" width="150" height="44" rx="9" fill="#FFFFFF" stroke="#D9822B" stroke-width="3"/>
    <text stroke="none" x="1815" y="207" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#B4651A" text-anchor="middle">70 px</text>

    <rect x="1740" y="622" width="150" height="44" rx="9" fill="#FFFFFF" stroke="#D9822B" stroke-width="3"/>
    <text stroke="none" x="1815" y="653" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#B4651A" text-anchor="middle">70 px</text>
  </g>

  <!-- safe area label -->
  <rect x="1104" y="248" width="472" height="58" fill="#E6F6F8" stroke="#1E8FA0" stroke-width="3" rx="8"/>
  <text stroke="none" x="1340" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="800" fill="#146B78" text-anchor="middle">Safe area 2240 × 380</text>

  <!-- header -->
  <text stroke="none" x="100" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#22304A">Banner canvas</text>
  <text stroke="none" x="366" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#6B7A90">2480 × 520 px, exported at 2x and shown at 1240 × 260 CSS px</text>

  <!-- legend -->
  <g transform="translate(1740,22)">
    <rect x="0" y="0" width="24" height="24" fill="none" stroke="#22304A" stroke-width="4"/>
    <text stroke="none" x="34" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#22304A">Canvas edge</text>
    <g transform="translate(180,0)">
      <rect x="0" y="4" width="26" height="16" fill="none" stroke="#1E8FA0" stroke-width="4" stroke-dasharray="8 5"/>
      <text stroke="none" x="36" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#1E8FA0">Safe area</text>
    </g>
    <g transform="translate(352,0)">
      <rect x="0" y="0" width="24" height="24" fill="url(#crop)" stroke="#D9822B" stroke-width="2"/>
      <text stroke="none" x="34" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#B4651A">Crop zone</text>
    </g>
  </g>

  <!-- rules -->
  <text stroke="none" x="100" y="768" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#5B6B80">Keep text and logo inside the safe area, at least 40 px from its edge; background art can bleed to the full canvas</text>
  <text stroke="none" x="1880" y="768" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#B4651A">Crop: 120 px left and right, 70 px top and bottom</text>
</svg>
